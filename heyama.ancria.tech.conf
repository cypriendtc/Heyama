<VirtualHost *:80>
    ServerName heyama.ancria.tech

    # Web App (Next.js on port 3000)
    ProxyPreserveHost On

    # API routes
    ProxyPass /api http://localhost:3001/api
    ProxyPassReverse /api http://localhost:3001/api

    # Socket.IO (WebSocket + polling)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/socket.io/(.*) ws://localhost:3001/socket.io/$1 [P,L]

    ProxyPass /socket.io http://localhost:3001/socket.io
    ProxyPassReverse /socket.io http://localhost:3001/socket.io

    # MinIO images (public read)
    ProxyPass /storage http://localhost:9000/heyama-objects
    ProxyPassReverse /storage http://localhost:9000/heyama-objects

    # Everything else → Next.js web app
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    ErrorLog ${APACHE_LOG_DIR}/heyama-error.log
    CustomLog ${APACHE_LOG_DIR}/heyama-access.log combined
</VirtualHost>
